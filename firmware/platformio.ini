; RootWise firmware environments
; Default: classic ESP32 pin map (see include/board_config.h)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_rts = 0
monitor_dtr = 0
build_flags =
  -DBOARD_ESP32
build_src_filter = +<*> -<.git/> -<.svn/>
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
  bblanchon/ArduinoJson@^7.2.1

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.wchusbserial5A460307141
monitor_port = /dev/cu.wchusbserial5A460307141
build_flags =
  -DBOARD_ESP32S3
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
  bblanchon/ArduinoJson@^7.2.1
